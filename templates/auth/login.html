<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% extends "base.html" %}
{% block content %}

<div class="container">
    <h1>Login</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <label for="username">Username</label>
        <input type="text" name="username" required>

        <label for="password">Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn-login-regist">Login</button>
    </form>

    <p>Don't have an account? 
        <a href="{{ url_for('auth.register') }}", class="hyperlink">
        Register
        </a>
    </p>

    <a href="{{ url_for('posts.index') }}" class="btn">To remain a guest</a>
    {% endblock %}
</div>

</body>
</html>
